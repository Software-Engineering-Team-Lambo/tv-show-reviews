name: Deploy to Production

on:
  workflow_dispatch:
  push:
    branches: [release]  # Still auto-build/deploy if someone does push

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-api

jobs:
  build:
    name: Build Docker Image and SPA
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Vue SPA
        run: npm run build -w=web

      - name: Upload SPA build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist/
          retention-days: 7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/release' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to Production Server
    needs: build
    runs-on: ubuntu-latest
    # Only deploy on push to release (not on PRs)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: production  # Requires manual approval
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download SPA build artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist/

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Copy files to server
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            apps/web/dist/ \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/tv-show-reviews/apps/web/dist/
          
          scp -i ~/.ssh/deploy_key \
            docker-compose.prod.yml \
            Caddyfile \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/tv-show-reviews/

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << 'ENDSSH'
            cd ~/tv-show-reviews
            
            # Login to GHCR to pull private image
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull latest Docker image
            docker compose -f docker-compose.prod.yml pull api
            
            # Run Prisma migrations (applies pending migrations only)
            docker compose -f docker-compose.prod.yml run --rm api npx prisma migrate deploy
            
            # Restart services
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            
            # Clean up old images
            docker image prune -f
            
            # Note: Database seeding is MANUAL ONLY
            # To seed: docker compose -f docker-compose.prod.yml run --rm api npm run seed
            
            # Logout from GHCR
            docker logout ghcr.io
          ENDSSH

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << 'ENDSSH'
            cd ~/tv-show-reviews
            docker compose -f docker-compose.prod.yml ps
          ENDSSH
