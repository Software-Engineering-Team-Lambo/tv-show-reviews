name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: ./apps/api

      - name: Type check API
        run: npm run typecheck -w=api

      - name: Type check Web
        run: npm run type-check -w=web

      - name: Lint API
        run: npm run lint -w=api

      - name: Lint Web
        run: npm run lint -w=web

      - name: Build API
        run: npm run build -w=api

      - name: Build Web
        run: npm run build -w=web

  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: tv_ratings_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: ./apps/api

      - name: Run API tests
        run: npm run test -w=api
        env:
          DATABASE_URL: mysql://root:rootpass@localhost:3306/tv_ratings_test
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          JWT_SECRET: test-jwt-secret-key
